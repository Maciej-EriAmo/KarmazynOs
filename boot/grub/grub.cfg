# GRUB ładuje kentry (Multiboot2). Obraz markera serialu, nie prompt produktu.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console
set timeout=0
set default=0

menuentry "Karmazyn kentry" {
    multiboot2 /boot/karmazyn_kentry karmazyn.kentry=1
    boot
}
