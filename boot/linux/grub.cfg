# Linux ładuje shell Karmazyna jako /init. Osobny obraz od płyty kentry.
# console=tty0 console=ttyS0: jądro pisze na ekran i serial; shell (PID 1) sam
# otwiera tty1 i ttyS0 (KARMAZYN_CONSOLE=auto|vga|serial|none).
# KARMAZYN_IP/KARMAZYN_GW: adres w sieci użytkownika QEMU (host = 10.0.2.2);
# na innej sieci zmień albo usuń (bez KARMAZYN_IP sieć zostaje wyłączona).
# no_timer_check: pod QEMU TCG kalibracja PIT bywa nieudana i jądro panikuje na IO-APIC.
set timeout=0
set default=0

menuentry "Karmazyn Linux" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 no_timer_check KARMAZYN_LUA_BIN=/lua_bin KARMAZYN_LUA_BUDGET=50000000 KARMAZYN_DISK=/dev/vda KARMAZYN_IP=10.0.2.15/24 KARMAZYN_GW=10.0.2.2
    initrd /boot/initramfs.cpio
    boot
}
