[package]
name = "karmazyn_kentry"
version = "0.1.0"
edition = "2021"
authors = ["Maciej Mazur"]
description = "KarmazynOs Multiboot2 kentry — serial + SlabStore demo (R5)."
license = "MIT"
publish = false

[dependencies]
# freestanding reach-GC (no_std) — same crate as substrate re-export
karmazyn_slab = { path = "../../native/karmazyn_slab" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
