# Enterprise G0 — PR / push gate
name: gate-product

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test (LFS package set: slab → substrate → shell → kcc)
        run: |
          cargo test --manifest-path native/karmazyn_slab/Cargo.toml
          cargo test --manifest-path native/karmazyn_substrate/Cargo.toml
          cargo test --manifest-path native/karmazyn_lisp/Cargo.toml
          cargo test --manifest-path native/karmazyn_shell/Cargo.toml
          cargo test --manifest-path toolchain/kcc/Cargo.toml

      - name: cargo build release (substrate)
        run: cargo build --release --manifest-path native/karmazyn_substrate/Cargo.toml

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip deps
        run: |
          python -m pip install -U pip
          pip install numpy
          # Studio optional on CI — tests skip if no pygame
          pip install pygame || true

      - name: kernel_boundary
        run: python kernel_boundary.py kernel/ software/

      - name: unittest (io + host + studio + bootcfg + kentry)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/archiwum/kernel_python:${{ github.workspace }}/software:${{ github.workspace }}/native
          KARMAZYN_SUBSTRATE: python
          KARMAZYN_LUA: ${{ github.workspace }}/LUA
        run: |
          python -m unittest software.test_io_thermal software.test_host_tools software.test_studio_sdl software.test_bootcfg software.test_kentry_marker -q

      - name: kentry freestanding build
        run: |
          rustup target add x86_64-unknown-none
          cargo build --release --manifest-path boot/kentry/Cargo.toml --target x86_64-unknown-none
          python -c "p='boot/kentry/target/x86_64-unknown-none/release/karmazyn_kentry'; d=open(p,'rb').read(); assert b'KARMAZYN_KENTRY_OK' in d, 'marker missing'; assert b'SLAB_OK' in d, 'SLAB_OK missing (R5)'"

      # Full native wheel on Linux CI — best-effort (maturin)
      - name: maturin build (best-effort)
        continue-on-error: true
        run: |
          pip install maturin
          cd native/karmazyn_substrate_rs
          maturin build --release
