# Linux ładuje shell Karmazyna jako /init. Osobny obraz od płyty kentry.
# no_timer_check: pod QEMU TCG kalibracja PIT bywa nieudana i jądro panikuje na IO-APIC.
set timeout=0
set default=0

menuentry "Karmazyn Linux" {
    linux /boot/vmlinuz console=ttyS0,115200 no_timer_check KARMAZYN_LUA_BIN=/lua_bin KARMAZYN_LUA_BUDGET=50000000 KARMAZYN_DISK=/dev/vda
    initrd /boot/initramfs.cpio
    boot
}
