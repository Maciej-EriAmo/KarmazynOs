[package]
name = "karmazyn_slab"
version = "0.1.0"
edition = "2021"
authors = ["Maciej Mazur"]
description = "KarmazynOS freestanding slab + bump + reach-GC (no_std, R5)"
license = "MIT"
repository = "https://github.com/Maciej-EriAmo/KarmazynOs"
publish = false

[lib]
name = "karmazyn_slab"
path = "src/lib.rs"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
