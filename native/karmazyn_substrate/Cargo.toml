[package]
name = "karmazyn_substrate"
version = "0.1.0"
edition = "2021"
authors = ["Maciej Mazur"]
description = "KarmazynOS substrate — atoms, bubbles, reach-GC (native core)"
license = "MIT"
repository = "https://github.com/Maciej-EriAmo/KarmazynOs"

[lib]
name = "karmazyn_substrate"
crate-type = ["cdylib", "rlib"]

[features]
# default std = L1 host Store (HashMap/String). freestanding path: slab module (R3).
default = ["std"]
std = []

[dependencies]
# std only for full Store — no crates.io deps

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
